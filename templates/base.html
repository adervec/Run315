<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Run315{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="manifest" href="{{ url_for('manifest') }}">
<meta name="theme-color" content="#101828">
<link rel="icon" href="{{ url_for('static', filename='icon-192.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Run315">
</head>
<body>
{% block body %}{% endblock %}
<footer class="maker-note">
  More apps by the same maker, all free and local-first &mdash;
  <a href="https://adervec.github.io/portal/" target="_blank" rel="noopener">adervec.github.io</a>
</footer>
<style>
  .maker-note { max-width: 1100px; margin: 32px auto 24px; padding: 0 18px;
    font: 13px/1.5 system-ui, sans-serif; color: #7a8290; }
</style>
<script>
  // Let the maker's app portal know (same-origin localStorage) that this app is installed.
  // The public demo is a synthetic athlete, so it never reports anything — and freeze.py adds
  // its banner just before </body>, so the check has to wait for the parsed document.
  addEventListener('DOMContentLoaded', function () {
    try {
      var dm = ['standalone', 'minimal-ui', 'fullscreen', 'window-controls-overlay'];
      if (!document.getElementById('frozen-note')
          && (navigator.standalone || dm.some(function (m) { return matchMedia('(display-mode: ' + m + ')').matches; }))) {
        var pk = 'portal-installed', reg = JSON.parse(localStorage.getItem(pk) || '{}');
        reg.Run315 = Date.now();
        localStorage.setItem(pk, JSON.stringify(reg));
      }
    } catch (e) { /* private mode - ignore */ }
  });

  // Installable, and readable on the train. See templates/sw.js.
  if ('serviceWorker' in navigator) {
    addEventListener('load', function () {
      navigator.serviceWorker.register('{{ url_for("service_worker") }}');
    });
  }
</script>
</body>
</html>
