    if (navigator.standalone || dm.some(function (m) { return matchMedia('(display-mode: ' + m + ')').matches; })) {
      var reg = JSON.parse(localStorage.getItem('portal-installed') || '{}');
      reg.Run315 = Date.now(); localStorage.setItem('portal-installed', JSON.stringify(reg));

  } catch (e) { /* private mode */ }
